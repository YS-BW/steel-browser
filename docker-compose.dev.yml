services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        NODE_VERSION: 22.13.0
    ports:
      - "3000:3000"
      - "9223:9223"
      - "3001:3001"
      # - "10000-11000:10000-11000/udp" # Pion's ephemeral UDP ports for ICE
      - "10000-10010:10000-10010/udp"
      - "5004:5004/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost:3000}
      - CDP_DOMAIN=${CDP_DOMAIN:-localhost:9223}
      - CHROME_HEADLESS=false
      - DISPLAY=:10
      - XAUTHORITY=/tmp/.Xauthority
      - ICE_SERVERS_JSON=${ICE_SERVERS_JSON:-[]}
      - EXTERNAL_IP=${EXTERNAL_IP:-127.0.0.1}
    volumes:
      - ./.cache:/app/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix
      - x11-auth:/tmp
      - recordings:/recordings
    networks:
      - steel-network

  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
    ports:
      - "5173:80"
    environment:
      - API_URL=${API_URL:-http://api:3000}
    depends_on:
      - api
    networks:
      - steel-network

volumes:
  x11-auth:
  recordings:

networks:
  steel-network:
    name: steel-network
    driver: bridge
