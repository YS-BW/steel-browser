name: Publish WebRTC image

on:
  push:
    branches: [webrtc-headful-fixes]
    tags: [webrtc-*]
    paths:
      - api/**
      - package.json
      - package-lock.json
      - tests/webrtc/**
      - .github/workflows/webrtc-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: webrtc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image name
        id: image
        shell: bash
        run: |
          printf 'name=ghcr.io/%s/steel-browser-webrtc\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=webrtc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=webrtc-${{ matrix.arch }}
      - name: Install media test dependencies
        run: python3 -m pip install -r tests/webrtc/requirements.txt
      - name: Verify actual H.264 decoding
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: bash tests/webrtc/smoke.sh "$TEST_IMAGE"
      - name: Push tested architecture
        env:
          TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$TEST_IMAGE"
      - name: Save smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/steel-webrtc-smoke/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/steel-browser-webrtc"
          tags=(-t "$image:webrtc" -t "$image:latest" -t "$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(-t "$image:$GITHUB_REF_NAME")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" | tee image-manifest.txt
          {
            printf '### Tested WebRTC image\n\n'
            printf '```sh\ndocker pull %s:webrtc\n```\n\n' "$image"
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Architectures: `linux/amd64`, `linux/arm64`. Both passed actual video decoding.\n'
          } >> "$GITHUB_STEP_SUMMARY"
